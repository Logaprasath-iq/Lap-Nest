<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../assets/css/style.css?v=7.1">
  <style>
    body { background: #f8fafc; padding: 50px; font-family: sans-serif; display: flex; gap: 30px; align-items: center; }
    .box { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #1e293b; }
    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- 22px Orange (What user saw as tiny) -->
  <div class="box">
    <span>22px (Orange)</span>
    <button class="theme-toggle-btn">
      <svg style="width: 22px; height: 22px; color: #FD802E;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"></path>
      </svg>
    </button>
  </div>

  <!-- 26px Orange stroke 2.5 -->
  <div class="box">
    <span>26px (Orange 2.5)</span>
    <button class="theme-toggle-btn">
      <svg style="width: 26px; height: 26px; color: #FD802E;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"></path>
      </svg>
    </button>
  </div>

  <!-- 28px Orange stroke 2.5 -->
  <div class="box">
    <span>28px (Orange 2.5)</span>
    <button class="theme-toggle-btn">
      <svg style="width: 28px; height: 28px; color: #FD802E;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"></path>
      </svg>
    </button>
  </div>

  <!-- Sun 24px Orange stroke 2 -->
  <div class="box">
    <span>Sun 24px (Orange)</span>

      <svg style="width: 24px; height: 24px; color: #FD802E;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

    </button>

</html>
