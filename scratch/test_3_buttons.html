  <style>
    body { background: #f8fafc; padding: 50px; font-family: sans-serif; display: flex; flex-direction: column; gap: 40px; }
    .row { display: flex; gap: 12px; align-items: center; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #475569; }
    .guide-line { position: relative; }
    .guide-line::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: rgba(239, 68, 68, 0.2);
      pointer-events: none;
    }

        </svg>
